name: Import portfolio art
on:
  push:
    paths:
      - '.github/workflows/import-portfolio-art.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and preserve illustration in repository
        env:
          FULL_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:1402/quality:100/uri:ifs%3A%2F%2FM%2Fffdf7a82-1624-4482-932e-3ed3101e08e2/watermark:F/width:1122?csig=AAAAAAAAAAAAAAAAAAAAAH-eNGu14hlV6JEbJBARPwrhjuYKBQOmOQImM4Ael_-b&exp=1792657969&osig=AAAAAAAAAAAAAAAAAAAAAHMDGHEin05mxJqvMXB8Hikd6M3M1xc5NIb82C2Ag1WQ&signer=media-rpc&token=AAIAAU0AJGZmZGY3YTgyLTE2MjQtNDQ4Mi05MzJlLTNlZDMxMDFlMDhlMgAAAAABoWK9z2jK4p3MR2dkRMLCE7CHfu6g2FafYAVVcAhmeuVw5Hf5Cw&x-canva-quality=original'
          THUMB_URL: 'https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fffdf7a82-1624-4482-932e-3ed3101e08e2/watermark:F/width:160?csig=AAAAAAAAAAAAAAAAAAAAAH-eNGu14hlV6JEbJBARPwrhjuYKBQOmOQImM4Ael_-b&exp=1792657969&osig=AAAAAAAAAAAAAAAAAAAAAHMDGHEin05mxJqvMXB8Hikd6M3M1xc5NIb82C2Ag1WQ&signer=media-rpc&token=AAIAAU0AJGZmZGY3YTgyLTE2MjQtNDQ4Mi05MzJlLTNlZDMxMDFlMDhlMgAAAAABoWK9z2jK4p3MR2dkRMLCE7CHfu6g2FafYAVVcAhmeuVw5Hf5Cw&x-canva-quality=thumbnail'
        run: |
          mkdir -p public
          if ! curl -fLSs --retry 2 "$FULL_URL" -o public/lain-computer.png; then
            echo "Full-sized CDN rendition unavailable; downloading thumbnail fallback"
            curl -fLSs --retry 2 "$THUMB_URL" -o public/lain-computer.png
          fi
          file public/lain-computer.png
          wc -c public/lain-computer.png
          identify public/lain-computer.png || true
          test -s public/lain-computer.png
      - name: Commit the downloaded image permanently
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add public/lain-computer.png
          git diff --cached --quiet || (git commit -m "assets: preserve anime illustration in portfolio" && git push)
